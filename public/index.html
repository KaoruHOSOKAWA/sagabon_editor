<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sagabon 組版システム</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Sagabon Prototype</p>
            <h1>縦組エディタ</h1>
          </div>
          <p class="hint">1行に1文字。改行は <code>\n</code> を入力。</p>
        </div>

        <div class="toolbar">
          <button id="add-row-button" type="button">行を追加</button>
          <button id="save-button" type="button">CSV保存</button>
          <button id="load-button" type="button">CSV/TXT読込</button>
          <button id="print-button" type="button">印刷</button>
          <input id="file-input" type="file" accept=".csv,text/csv,.txt,text/plain" hidden />
        </div>

        <div class="summary-bar">
          <span id="row-count">0 行</span>
          <span id="page-count">0 ページ</span>
        </div>

        <div class="table-wrap">
          <table class="editor-table">
            <thead>
              <tr>
                <th>#</th>
                <th>文字</th>
                <th>異体字</th>
                <th>状態</th>
                <th>挿入</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="editor-body"></tbody>
          </table>
        </div>
      </aside>

      <main class="preview-panel">
        <div class="preview-header">
          <div>
            <p class="eyebrow">A4 Preview</p>
            <h2>印刷プレビュー</h2>
          </div>
          <p id="status-text" class="status-text">フォント情報を読み込み中...</p>
        </div>
        <div id="preview-root" class="preview-root"></div>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
